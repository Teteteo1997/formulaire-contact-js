<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Formulaire Dynamique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="form-container">
    <h2>Contactez-nous</h2>
    
    <!-- Ajout de name="contact" et netlify -->
    <form id="contact-form" name="contact" netlify>
      
      <!-- Champ caché technique nécessaire pour le JS avec Netlify -->
      <input type="hidden" name="form-name" value="contact" />

      <div>
        <label for="name">Nom :</label>

        <input type="text" id="name" name="name" required>
      </div>

      <div>
        <label for="email">Email :</label>

        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="message">Message :</label>

        <textarea id="message" name="message" required></textarea>
      </div>

      <button type="submit" id="submit-btn">Envoyer</button>
    </form>

    <!-- Zone d'affichage du statut -->
    <div id="status-message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
